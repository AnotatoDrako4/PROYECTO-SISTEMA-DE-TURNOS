<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #3b82f6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
    --success: #22c55e;
    --warning: #f97316;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: #0b1221;
    border-bottom: 1px solid var(--border);
    z-index: 10;
  }

  .app-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    margin-top: 64px;
    min-height: calc(100vh - 64px);
  }

  .sidebar {
    background: #0b1221;
    border-right: 1px solid var(--border);
    padding: 16px;
  }

  .sidebar ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar li {
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--muted);
    transition: background 0.2s ease, color 0.2s ease;
  }

  .sidebar li:hover {
    background: var(--panel);
    color: var(--text);
  }

  .sidebar li.active {
    background: var(--accent);
    color: #0b1221;
    font-weight: 600;
  }

  .content {
    padding: 24px;
    overflow-y: auto;
  }

  .vista-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    min-height: 70vh;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    background: #111827;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .card h3 {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .card .value {
    font-size: 28px;
    font-weight: 800;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .section-header h2 {
    font-size: 18px;
  }

  .btn {
    border: none;
    background: var(--accent);
    color: #0b1221;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .btn:hover { transform: translateY(-1px); }

  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }

  th, td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }

  th { color: var(--muted); font-size: 12px; letter-spacing: 0.3px; }

  tr:hover td { background: rgba(59, 130, 246, 0.06); }

  form {
    display: grid;
    gap: 12px;
    margin-top: 12px;
  }

  label { font-size: 12px; color: var(--muted); }

  input, select, textarea {
    background: #0b1221;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
  }

  textarea { min-height: 80px; }

  .grid-2 {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    color: #0b1221;
  }

  .badge.success { background: var(--success); }
  .badge.warning { background: var(--warning); }
  .badge.muted { background: var(--border); color: var(--text); }

  .alert {
    padding: 12px 14px;
    border-radius: 10px;
    margin-top: 12px;
    border: 1px solid var(--border);
  }

  .alert.success { background: rgba(34, 197, 94, 0.12); color: #bbf7d0; }
  .alert.error { background: rgba(239, 68, 68, 0.12); color: #fecdd3; }
</style>
