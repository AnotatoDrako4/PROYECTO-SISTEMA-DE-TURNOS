<div class="section-header">

  <span class="badge muted">Parámetros y logs</span>
</div>
<div class="grid-2">
  <div class="card">
    <h3>Parámetros</h3>
    <table id="tablaParametros">
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Activo</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="card">
    <h3>Logs del sistema</h3>
    <table id="tablaLogs">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Usuario</th>
          <th>Acción</th>
          <th>Detalle</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
